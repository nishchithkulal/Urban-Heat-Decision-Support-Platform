name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: heatpilot
          POSTGRES_PASSWORD: heatpilot
          POSTGRES_DB: heatpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heatpilot -d heatpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEATPILOT_DATABASE_URL: postgresql+asyncpg://heatpilot:heatpilot@localhost:5432/heatpilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Test
        run: pytest -v
